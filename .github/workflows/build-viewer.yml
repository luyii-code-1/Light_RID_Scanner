name: Build Viewer Binary

permissions:
  contents: write

on:
  push:
  release:
    types: [published]
  workflow_dispatch:

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
  BUILD_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

jobs:
  viewer:
    name: viewer ${{ matrix.target }}
    env:
      CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-24.04
            python-architecture: x64
          - target: arm64
            runner: ubuntu-24.04-arm
            python-architecture: arm64
          - target: windows-x86_64
            runner: windows-2025
            python-architecture: x64
          - target: windows-x32
            runner: windows-2025
            python-architecture: x86

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Require CI repo token
        if: ${{ env.CI_REPO_TOKEN == '' }}
        shell: bash
        run: |
          echo "CI_REPO_TOKEN is required for checkout in this repository."
          exit 1

      - name: Checkout code with CI token
        uses: actions/checkout@v5
        with:
          token: ${{ env.CI_REPO_TOKEN }}
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-architecture }}

      - name: Show runner info
        shell: bash
        run: |
          set -euxo pipefail
          python --version
          python -c "import os, platform; print(platform.platform()); print(platform.machine()); print(os.name)"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build viewer binary
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_COMMIT="$(git rev-parse --short=7 HEAD)"
          python pytools/build_viewer.py --target "${{ matrix.target }}" --release-tag "${{ env.RELEASE_TAG }}" --build-commit "${BUILD_COMMIT}"

      - name: Prepare artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-upload
          cp "release/viewer/${{ matrix.target }}"/* release-upload/
          ls -lah release-upload

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: viewer-${{ matrix.target }}-${{ github.sha }}
          path: release-upload/*
          if-no-files-found: error

      - name: Upload binary to GitHub Release
        if: ${{ github.event_name == 'release' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: |
          set -euxo pipefail
          gh release upload "${RELEASE_TAG}" release-upload/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  viewer-linux-x32:
    name: viewer x32
    runs-on: ubuntu-24.04
    env:
      CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN }}

    steps:
      - name: Require CI repo token
        if: ${{ env.CI_REPO_TOKEN == '' }}
        shell: bash
        run: |
          echo "CI_REPO_TOKEN is required for checkout in this repository."
          exit 1

      - name: Checkout code with CI token
        uses: actions/checkout@v5
        with:
          token: ${{ env.CI_REPO_TOKEN }}
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      - name: Show runner info
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          docker version

      - name: Build 32-bit viewer binary
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_COMMIT="$(git rev-parse --short=7 HEAD)"
          docker run --rm --platform linux/386 \
            -e RELEASE_TAG="${{ env.RELEASE_TAG }}" \
            -e BUILD_COMMIT="${BUILD_COMMIT}" \
            -v "$PWD:/work" \
            -w /work \
            python:3.12-bookworm \
            bash -lc 'set -euxo pipefail
              apt-get update
              apt-get install -y --no-install-recommends file
              python -m pip install --upgrade pip
              pip install pyinstaller
              python pytools/build_viewer.py --target x32 --release-tag "$RELEASE_TAG" --build-commit "$BUILD_COMMIT"
              file "release/viewer/x32"/*'

      - name: Prepare artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-upload
          cp "release/viewer/x32"/* release-upload/
          ls -lah release-upload

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: viewer-x32-${{ github.sha }}
          path: release-upload/*
          if-no-files-found: error

      - name: Upload binary to GitHub Release
        if: ${{ github.event_name == 'release' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: |
          set -euxo pipefail
          gh release upload "${RELEASE_TAG}" release-upload/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
