name: Build Viewer Binary

permissions:
  contents: read

on:
  push:
  workflow_dispatch:

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
  BUILD_REF: ${{ github.sha }}

jobs:
  viewer:
    name: viewer ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-24.04
            python-architecture: x64
          - target: arm64
            runner: ubuntu-24.04-arm
            python-architecture: arm64
          - target: windows-x86_64
            runner: windows-2025
            python-architecture: x64
          - target: windows-x32
            runner: windows-2025
            python-architecture: x86

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-architecture }}

      - name: Show runner info
        shell: bash
        run: |
          set -euxo pipefail
          python --version
          python -c "import os, platform; print(platform.platform()); print(platform.machine()); print(os.name)"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build viewer binary
        shell: bash
        run: |
          set -euxo pipefail
          python pytools/build_viewer.py --target "${{ matrix.target }}"

      - name: Prepare artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-upload
          cp "release/viewer/${{ matrix.target }}"/* release-upload/
          ls -lah release-upload

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: viewer-${{ matrix.target }}-${{ github.sha }}
          path: release-upload/*
          if-no-files-found: error

  viewer-linux-x32:
    name: viewer x32
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Show runner info
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          docker version

      - name: Build 32-bit viewer binary
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/386 \
            -v "$PWD:/work" \
            -w /work \
            python:3.12-bookworm \
            bash -lc 'set -euxo pipefail
              apt-get update
              apt-get install -y --no-install-recommends file
              python -m pip install --upgrade pip
              pip install pyinstaller
              python pytools/build_viewer.py --target x32
              file "release/viewer/x32"/*'

      - name: Prepare artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-upload
          cp "release/viewer/x32"/* release-upload/
          ls -lah release-upload

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: viewer-x32-${{ github.sha }}
          path: release-upload/*
          if-no-files-found: error
