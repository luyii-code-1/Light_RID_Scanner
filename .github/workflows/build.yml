name: Build Binaries

permissions:
  contents: write

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to build and upload"
        required: false
        default: ""

env:
  APP_NAME: light_rid_scanner
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || '' }}
  BUILD_REF: ${{ github.event.release.tag_name || github.event.inputs.tag || github.sha }}

jobs:
  linux:
    name: Linux ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux-amd64
          - runner: ubuntu-24.04-arm
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build binary
        shell: bash
        run: |
          pyinstaller \
            --onefile \
            --clean \
            --name "$APP_NAME" \
            run.py

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p release
          mv "dist/$APP_NAME" "release/$APP_NAME-${{ matrix.artifact }}"

      - name: Upload workflow artifact
        if: ${{ env.RELEASE_TAG == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

      - name: Upload binary to release
        if: ${{ env.RELEASE_TAG != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*
          fail_on_unmatched_files: true

  desktop-release:
    name: Release ${{ matrix.artifact }}
    if: ${{ env.RELEASE_TAG != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: windows-amd64.exe
          - runner: macos-15-intel
            artifact: macos-amd64
          - runner: macos-latest
            artifact: macos-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build binary
        shell: bash
        run: |
          pyinstaller \
            --onefile \
            --clean \
            --name "$APP_NAME" \
            run.py

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p release
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            mv "dist/$APP_NAME.exe" "release/$APP_NAME-${{ matrix.artifact }}"
          else
            mv "dist/$APP_NAME" "release/$APP_NAME-${{ matrix.artifact }}"
          fi

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*
          fail_on_unmatched_files: true
