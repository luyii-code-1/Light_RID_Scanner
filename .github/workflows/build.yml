name: Build Linux Binaries

permissions:
  contents: write

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to build and upload to release"
        required: false
        default: ""

env:
  APP_NAME: light_rid_scanner
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || '' }}
  BUILD_REF: ${{ github.event.release.tag_name || github.event.inputs.tag || github.sha }}

jobs:
  linux:
    name: Linux ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux-amd64
          - runner: ubuntu-24.04-arm
            artifact: linux-arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show runner info
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          python --version

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build binary
        shell: bash
        run: |
          set -euxo pipefail

          pyinstaller \
            --onefile \
            --clean \
            --name "$APP_NAME" \
            run.py

          echo "=== dist files ==="
          ls -lah dist
          file "dist/$APP_NAME"

      - name: Prepare artifact
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p release

          SRC="dist/$APP_NAME"
          DST="release/$APP_NAME-${{ matrix.artifact }}"

          test -f "$SRC"
          mv "$SRC" "$DST"
          chmod +x "$DST"

          echo "=== release files ==="
          ls -lah release
          file "$DST"

      - name: Upload workflow artifact
        if: ${{ env.RELEASE_TAG == '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ env.APP_NAME }}-${{ matrix.artifact }}
          if-no-files-found: error

      - name: Upload binary to GitHub Release
        if: ${{ env.RELEASE_TAG != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          gh release upload "${RELEASE_TAG}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
