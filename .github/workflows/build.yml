name: Build Edition Binaries

permissions:
  contents: read

on:
  push:
  workflow_dispatch:

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
  BUILD_REF: ${{ github.sha }}

jobs:
  linux-native:
    name: ${{ matrix.edition }} linux-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: station
            target: x86_64
            runner: ubuntu-24.04
          - edition: station
            target: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CI_REPO_TOKEN }}
          ref: ${{ env.BUILD_REF }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show runner info
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          python --version
          python -c 'import os, platform, struct; print("python_bits =", struct.calcsize("P") * 8); print("platform_machine =", platform.machine()); print("uname_machine =", os.uname().machine)'

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build binary
        shell: bash
        run: |
          set -euxo pipefail
          python pytools/build_release.py \
            --edition "${{ matrix.edition }}" \
            --target "${{ matrix.target }}" \
            --release-tag "${{ env.RELEASE_TAG }}"
          file "release/${{ matrix.edition }}/${{ matrix.target }}"/*

      - name: Prepare artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-upload

          SRC="release/${{ matrix.edition }}/${{ matrix.target }}/light_rid_${{ matrix.edition }}-${{ matrix.target }}"
          DST="release-upload/light_rid_${{ matrix.edition }}-linux-${{ matrix.target }}"

          cp "$SRC" "$DST"
          chmod +x "$DST"

          file "$DST"
          ls -lah release-upload

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: station-linux-${{ matrix.target }}-${{ github.sha }}
          path: release-upload/*
          if-no-files-found: error

  linux-x32:
    name: ${{ matrix.edition }} linux-x32
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        edition: [station]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CI_REPO_TOKEN }}
          ref: ${{ env.BUILD_REF }}

      - name: Show runner info
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          docker version

      - name: Build 32-bit x86 binary
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/386 \
            -v "$PWD:/work" \
            -w /work \
            python:3.12-bookworm \
            bash -lc 'set -euxo pipefail
              apt-get update
              apt-get install -y --no-install-recommends file
              python -c "import os, platform, struct; print(\"python_bits =\", struct.calcsize(\"P\") * 8); print(\"platform_machine =\", platform.machine()); print(\"uname_machine =\", os.uname().machine)"
              python -m pip install --upgrade pip
              pip install pyinstaller -r requirements.txt
              python pytools/build_release.py --edition "${{ matrix.edition }}" --target x32 --release-tag "${{ env.RELEASE_TAG }}"
              file "release/${{ matrix.edition }}/x32"/*'

      - name: Prepare artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-upload

          SRC="release/${{ matrix.edition }}/x32/light_rid_${{ matrix.edition }}-x32"
          DST="release-upload/light_rid_${{ matrix.edition }}-linux-x32"

          cp "$SRC" "$DST"
          chmod +x "$DST"

          file "$DST"
          ls -lah release-upload

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: station-linux-x32-${{ github.sha }}
          path: release-upload/*
          if-no-files-found: error

  linux-armv7:
    name: ${{ matrix.edition }} linux-armv7
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        edition: [station]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CI_REPO_TOKEN }}
          ref: ${{ env.BUILD_REF }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Show runner info
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          docker version

      - name: Build 32-bit ARMv7 binary
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/work" \
            -w /work \
            arm32v7/python:3.12-bookworm \
            bash -lc 'set -euxo pipefail
              apt-get update
              apt-get install -y --no-install-recommends file build-essential python3-dev libpcap-dev
              python -c "import os, platform, struct; print(\"python_bits =\", struct.calcsize(\"P\") * 8); print(\"platform_machine =\", platform.machine()); print(\"uname_machine =\", os.uname().machine)"
              python -m pip install --upgrade pip
              pip install pyinstaller -r requirements.txt
              python pytools/build_release.py --edition "${{ matrix.edition }}" --target armv7 --release-tag "${{ env.RELEASE_TAG }}"
              file "release/${{ matrix.edition }}/armv7"/*'

      - name: Prepare artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-upload

          SRC="release/${{ matrix.edition }}/armv7/light_rid_${{ matrix.edition }}-armv7"
          DST="release-upload/light_rid_${{ matrix.edition }}-linux-armv7"

          cp "$SRC" "$DST"
          chmod +x "$DST"

          file "$DST"
          ls -lah release-upload

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: station-linux-armv7-${{ github.sha }}
          path: release-upload/*
          if-no-files-found: error
