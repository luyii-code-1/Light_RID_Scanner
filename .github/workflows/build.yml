name: Build Edition Binaries

permissions:
  contents: write

on:
  push:
  release:
    types: [published]
  workflow_dispatch:

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
  BUILD_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

jobs:
  linux-native:
    name: ${{ matrix.edition }} linux-${{ matrix.target }}
    env:
      CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: station
            target: x86_64
            runner: ubuntu-24.04
          - edition: station
            target: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Require CI repo token
        if: ${{ env.CI_REPO_TOKEN == '' }}
        shell: bash
        run: |
          echo "CI_REPO_TOKEN is required for checkout in this repository."
          exit 1

      - name: Checkout code with CI token
        uses: actions/checkout@v5
        with:
          token: ${{ env.CI_REPO_TOKEN }}
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show runner info
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          python --version
          python -c 'import os, platform, struct; print("python_bits =", struct.calcsize("P") * 8); print("platform_machine =", platform.machine()); print("uname_machine =", os.uname().machine)'

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build binary
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_COMMIT="$(git rev-parse --short=7 HEAD)"
          python pytools/build_release.py \
            --edition "${{ matrix.edition }}" \
            --target "${{ matrix.target }}" \
            --release-tag "${{ env.RELEASE_TAG }}" \
            --build-commit "${BUILD_COMMIT}"
          file "release/${{ matrix.edition }}/${{ matrix.target }}"/*

      - name: Prepare artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-upload

          SRC="release/${{ matrix.edition }}/${{ matrix.target }}/light_rid_${{ matrix.edition }}-${{ matrix.target }}"
          DST="release-upload/light_rid_${{ matrix.edition }}-linux-${{ matrix.target }}"

          cp "$SRC" "$DST"
          chmod +x "$DST"

          file "$DST"
          ls -lah release-upload

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: station-linux-${{ matrix.target }}-${{ github.sha }}
          path: release-upload/*
          if-no-files-found: error

      - name: Upload binary to GitHub Release
        if: ${{ github.event_name == 'release' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: |
          set -euxo pipefail
          gh release upload "${RELEASE_TAG}" release-upload/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  linux-x32:
    name: ${{ matrix.edition }} linux-x32
    runs-on: ubuntu-24.04
    env:
      CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        edition: [station]

    steps:
      - name: Require CI repo token
        if: ${{ env.CI_REPO_TOKEN == '' }}
        shell: bash
        run: |
          echo "CI_REPO_TOKEN is required for checkout in this repository."
          exit 1

      - name: Checkout code with CI token
        uses: actions/checkout@v5
        with:
          token: ${{ env.CI_REPO_TOKEN }}
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      - name: Show runner info
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          docker version

      - name: Pull x32 build image with retry
        shell: bash
        run: |
          set -euxo pipefail
          IMAGE="python:3.12-bookworm"
          for attempt in 1 2 3 4 5; do
            if docker pull --platform linux/386 "$IMAGE"; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Failed to pull $IMAGE for linux/386 after $attempt attempts."
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Build 32-bit x86 binary
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_COMMIT="$(git rev-parse --short=7 HEAD)"
          docker run --rm --platform linux/386 \
            --pull never \
            -e RELEASE_TAG="${{ env.RELEASE_TAG }}" \
            -e BUILD_COMMIT="${BUILD_COMMIT}" \
            -v "$PWD:/work" \
            -w /work \
            python:3.12-bookworm \
            bash -lc 'set -euxo pipefail
              apt-get update
              apt-get install -y --no-install-recommends file
              python -c "import os, platform, struct; print(\"python_bits =\", struct.calcsize(\"P\") * 8); print(\"platform_machine =\", platform.machine()); print(\"uname_machine =\", os.uname().machine)"
              python -m pip install --upgrade pip
              pip install pyinstaller -r requirements.txt
              python pytools/build_release.py --edition "${{ matrix.edition }}" --target x32 --release-tag "$RELEASE_TAG" --build-commit "$BUILD_COMMIT"
              file "release/${{ matrix.edition }}/x32"/*'

      - name: Prepare artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-upload

          SRC="release/${{ matrix.edition }}/x32/light_rid_${{ matrix.edition }}-x32"
          DST="release-upload/light_rid_${{ matrix.edition }}-linux-x32"

          cp "$SRC" "$DST"
          chmod +x "$DST"

          file "$DST"
          ls -lah release-upload

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: station-linux-x32-${{ github.sha }}
          path: release-upload/*
          if-no-files-found: error

      - name: Upload binary to GitHub Release
        if: ${{ github.event_name == 'release' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: |
          set -euxo pipefail
          gh release upload "${RELEASE_TAG}" release-upload/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  linux-armv7:
    name: ${{ matrix.edition }} linux-armv7
    runs-on: ubuntu-24.04
    env:
      CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        edition: [station]

    steps:
      - name: Require CI repo token
        if: ${{ env.CI_REPO_TOKEN == '' }}
        shell: bash
        run: |
          echo "CI_REPO_TOKEN is required for checkout in this repository."
          exit 1

      - name: Checkout code with CI token
        uses: actions/checkout@v5
        with:
          token: ${{ env.CI_REPO_TOKEN }}
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Show runner info
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          docker version

      - name: Pull ARMv7 build image with retry
        shell: bash
        run: |
          set -euxo pipefail
          IMAGE="arm32v7/python:3.12-bookworm"
          for attempt in 1 2 3 4 5; do
            if docker pull --platform linux/arm/v7 "$IMAGE"; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Failed to pull $IMAGE for linux/arm/v7 after $attempt attempts."
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Build 32-bit ARMv7 binary
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_COMMIT="$(git rev-parse --short=7 HEAD)"
          docker run --rm --platform linux/arm/v7 \
            --pull never \
            -e RELEASE_TAG="${{ env.RELEASE_TAG }}" \
            -e BUILD_COMMIT="${BUILD_COMMIT}" \
            -v "$PWD:/work" \
            -w /work \
            arm32v7/python:3.12-bookworm \
            bash -lc 'set -euxo pipefail
              apt-get update
              apt-get install -y --no-install-recommends file build-essential python3-dev libpcap-dev
              python -c "import os, platform, struct; print(\"python_bits =\", struct.calcsize(\"P\") * 8); print(\"platform_machine =\", platform.machine()); print(\"uname_machine =\", os.uname().machine)"
              python -m pip install --upgrade pip
              pip install pyinstaller -r requirements.txt
              python pytools/build_release.py --edition "${{ matrix.edition }}" --target armv7 --release-tag "$RELEASE_TAG" --build-commit "$BUILD_COMMIT"
              file "release/${{ matrix.edition }}/armv7"/*'

      - name: Prepare artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-upload

          SRC="release/${{ matrix.edition }}/armv7/light_rid_${{ matrix.edition }}-armv7"
          DST="release-upload/light_rid_${{ matrix.edition }}-linux-armv7"

          cp "$SRC" "$DST"
          chmod +x "$DST"

          file "$DST"
          ls -lah release-upload

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: station-linux-armv7-${{ github.sha }}
          path: release-upload/*
          if-no-files-found: error

      - name: Upload binary to GitHub Release
        if: ${{ github.event_name == 'release' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: |
          set -euxo pipefail
          gh release upload "${RELEASE_TAG}" release-upload/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
