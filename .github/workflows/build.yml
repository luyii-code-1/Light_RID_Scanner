name: Build Edition Binaries

permissions:
  contents: write

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to build and upload to release"
        required: false
        default: ""

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || '' }}
  BUILD_REF: ${{ github.event.release.tag_name || github.event.inputs.tag || github.sha }}

jobs:
  linux-native:
    name: ${{ matrix.edition }} linux-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: station
            target: x86_64
            runner: ubuntu-24.04
          - edition: portable
            target: x86_64
            runner: ubuntu-24.04
          - edition: station
            target: arm64
            runner: ubuntu-24.04-arm
          - edition: portable
            target: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show runner info
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          python --version
          python - <<'PY'
          import os
          import platform
          import struct

          print("python_bits =", struct.calcsize("P") * 8)
          print("platform_machine =", platform.machine())
          print("uname_machine =", os.uname().machine)
          PY

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build binary
        shell: bash
        run: |
          set -euxo pipefail
          python pytools/build_release.py \
            --edition "${{ matrix.edition }}" \
            --target "${{ matrix.target }}"
          file "release/${{ matrix.edition }}/${{ matrix.target }}"/*

      - name: Prepare artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-upload

          SRC="release/${{ matrix.edition }}/${{ matrix.target }}/light_rid_${{ matrix.edition }}-${{ matrix.target }}"
          DST="release-upload/light_rid_${{ matrix.edition }}-linux-${{ matrix.target }}"

          cp "$SRC" "$DST"
          chmod +x "$DST"

          file "$DST"
          ls -lah release-upload

      - name: Upload workflow artifact
        if: ${{ env.RELEASE_TAG == '' }}
        uses: actions/upload-artifact@v6
        with:
          name: light_rid_${{ matrix.edition }}-linux-${{ matrix.target }}
          path: release-upload/*
          if-no-files-found: error

      - name: Upload binary to GitHub Release
        if: ${{ env.RELEASE_TAG != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release upload "${RELEASE_TAG}" release-upload/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  linux-x32:
    name: ${{ matrix.edition }} linux-x32
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        edition: [station, portable]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Show runner info
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          docker version

      - name: Build 32-bit x86 binary
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/386 \
            -v "$PWD:/work" \
            -w /work \
            python:3.12-bookworm \
            bash -lc 'set -euxo pipefail
              apt-get update
              apt-get install -y --no-install-recommends file
              python - <<'"'"'PY'"'"'
import os
import platform
import struct

print("python_bits =", struct.calcsize("P") * 8)
print("platform_machine =", platform.machine())
print("uname_machine =", os.uname().machine)
PY
              python -m pip install --upgrade pip
              pip install pyinstaller -r requirements.txt
              python pytools/build_release.py \
                --edition "${{ matrix.edition }}" \
                --target x32
              file "release/${{ matrix.edition }}/x32"/*'

      - name: Prepare artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-upload

          SRC="release/${{ matrix.edition }}/x32/light_rid_${{ matrix.edition }}-x32"
          DST="release-upload/light_rid_${{ matrix.edition }}-linux-x32"

          cp "$SRC" "$DST"
          chmod +x "$DST"

          file "$DST"
          ls -lah release-upload

      - name: Upload workflow artifact
        if: ${{ env.RELEASE_TAG == '' }}
        uses: actions/upload-artifact@v6
        with:
          name: light_rid_${{ matrix.edition }}-linux-x32
          path: release-upload/*
          if-no-files-found: error

      - name: Upload binary to GitHub Release
        if: ${{ env.RELEASE_TAG != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release upload "${RELEASE_TAG}" release-upload/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  linux-armv7:
    name: ${{ matrix.edition }} linux-armv7
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        edition: [station, portable]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Show runner info
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          docker version

      - name: Build 32-bit ARMv7 binary
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/work" \
            -w /work \
            arm32v7/python:3.12-bookworm \
            bash -lc 'set -euxo pipefail
              apt-get update
              apt-get install -y --no-install-recommends file build-essential python3-dev libpcap-dev
              python - <<'"'"'PY'"'"'
import os
import platform
import struct

print("python_bits =", struct.calcsize("P") * 8)
print("platform_machine =", platform.machine())
print("uname_machine =", os.uname().machine)
PY
              python -m pip install --upgrade pip
              pip install pyinstaller -r requirements.txt
              python pytools/build_release.py \
                --edition "${{ matrix.edition }}" \
                --target armv7
              file "release/${{ matrix.edition }}/armv7"/*'

      - name: Prepare artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-upload

          SRC="release/${{ matrix.edition }}/armv7/light_rid_${{ matrix.edition }}-armv7"
          DST="release-upload/light_rid_${{ matrix.edition }}-linux-armv7"

          cp "$SRC" "$DST"
          chmod +x "$DST"

          file "$DST"
          ls -lah release-upload

      - name: Upload workflow artifact
        if: ${{ env.RELEASE_TAG == '' }}
        uses: actions/upload-artifact@v6
        with:
          name: light_rid_${{ matrix.edition }}-linux-armv7
          path: release-upload/*
          if-no-files-found: error

      - name: Upload binary to GitHub Release
        if: ${{ env.RELEASE_TAG != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release upload "${RELEASE_TAG}" release-upload/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber