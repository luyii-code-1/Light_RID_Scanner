name: Rust Station

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: rust-station-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: station_edition_rust

      - name: Format
        run: cargo fmt --manifest-path station_edition_rust/Cargo.toml --check

      - name: Check
        run: cargo check --manifest-path station_edition_rust/Cargo.toml --target ${{ matrix.target }}

      - name: Test
        run: cargo test --manifest-path station_edition_rust/Cargo.toml --target ${{ matrix.target }}

      - name: Clippy
        run: cargo clippy --manifest-path station_edition_rust/Cargo.toml --target ${{ matrix.target }} -- -D warnings

  build-linux-arm:
    name: rust-station-${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: station_edition_rust

      - name: Check
        run: cargo check --manifest-path station_edition_rust/Cargo.toml --target ${{ matrix.target }}

  gl-ar750s-mips:
    name: gl-ar750s-mips-unknown-linux-musl
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: taiki-e/install-action@cross

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: station_edition_rust

      - name: Test under MIPS QEMU
        run: cross +nightly test -Z build-std --manifest-path station_edition_rust/Cargo.toml --target mips-unknown-linux-musl

      - name: Install matching OpenWrt 19.07.7 SDK
        shell: bash
        run: |
          set -euxo pipefail
          sdk_name=openwrt-sdk-19.07.7-ath79-generic_gcc-7.5.0_musl.Linux-x86_64
          sdk_archive="${sdk_name}.tar.xz"
          sdk_url="https://downloads.openwrt.org/releases/19.07.7/targets/ath79/generic/${sdk_archive}"
          curl --fail --location --retry 3 --output "$sdk_archive" "$sdk_url"
          echo "ca38e014e5432e307a52c28f2226a2d1aa30411caa72a1c40763152deea87c9f  $sdk_archive" | sha256sum --check
          mkdir .openwrt-sdk
          tar -xJf "$sdk_archive" -C .openwrt-sdk
          linker="$(find "$PWD/.openwrt-sdk" -name mips-openwrt-linux-musl-gcc -print -quit)"
          test -x "$linker"
          staging_dir="$(dirname "$(dirname "$(dirname "$linker")")")"
          test -d "$staging_dir"
          "$linker" --version
          STAGING_DIR="$staging_dir" "$linker" -print-sysroot
          test "$(STAGING_DIR="$staging_dir" "$linker" -print-file-name=crt1.o)" != crt1.o
          echo "OPENWRT_MIPS_LINKER=$linker" >> "$GITHUB_ENV"
          echo "OPENWRT_STAGING_DIR=$staging_dir" >> "$GITHUB_ENV"
          echo "$(dirname "$linker")" >> "$GITHUB_PATH"

      - name: Build static MIPS release
        env:
          CARGO_TARGET_MIPS_UNKNOWN_LINUX_MUSL_LINKER: ${{ env.OPENWRT_MIPS_LINKER }}
          STAGING_DIR: ${{ env.OPENWRT_STAGING_DIR }}
          RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=no
        run: cargo +nightly build -Z build-std=std,panic_abort --manifest-path station_edition_rust/Cargo.toml --target mips-unknown-linux-musl --release

      - name: Verify target ELF
        shell: bash
        run: |
          set -euxo pipefail
          binary=station_edition_rust/target/mips-unknown-linux-musl/release/light-rid-station
          file "$binary" | tee /tmp/file.txt
          grep -E 'ELF 32-bit MSB.*MIPS' /tmp/file.txt
          ! readelf -l "$binary" | grep -q 'Requesting program interpreter'
          ! readelf -d "$binary" | grep -q 'NEEDED'
          readelf -h "$binary" | grep -E 'Class:.*ELF32|Data:.*big endian|Machine:.*MIPS'

      - name: Assemble OpenWrt package
        shell: bash
        run: |
          set -euxo pipefail
          short_sha="${GITHUB_SHA::7}"
          root="release/gl-ar750s/root"
          mkdir -p "$root/usr/bin" "$root/etc/init.d" "$root/etc/light-rid"
          mkdir -p "$root/usr/share/light-rid/station_edition/light_rid"
          cp station_edition_rust/target/mips-unknown-linux-musl/release/light-rid-station "$root/usr/bin/"
          cp station_edition_rust/openwrt/light-rid.init "$root/etc/init.d/light-rid"
          cp station_edition_rust/config.gl-ar750s.json "$root/etc/light-rid/config.json"
          cp -R station_edition/light_rid/assets "$root/usr/share/light-rid/station_edition/light_rid/"
          chmod 0755 "$root/usr/bin/light-rid-station" "$root/etc/init.d/light-rid"
          tar -C "$root" -czf "release/light-rid-gl-ar750s-${short_sha}.tar.gz" .
          sha256sum "release/light-rid-gl-ar750s-${short_sha}.tar.gz" > "release/light-rid-gl-ar750s-${short_sha}.tar.gz.sha256"

      - name: Upload GL-AR750S artifact
        uses: actions/upload-artifact@v4
        with:
          name: light-rid-gl-ar750s-${{ github.sha }}
          path: |
            release/light-rid-gl-ar750s-*.tar.gz
            release/light-rid-gl-ar750s-*.tar.gz.sha256
          if-no-files-found: error
